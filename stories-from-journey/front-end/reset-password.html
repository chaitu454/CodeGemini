<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="stylesheets/common.css">
    <script type="module" src="scripts/reset-password.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="resetPasswordForm">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" readonly>

            <label for="security-question">Security Question</label>
            <input type="text" id="security-question" name="security-question" readonly>

            <label for="security-answer">Answer</label>
            <input type="text" id="security-answer" name="security-answer" required>

            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="new-password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <button type="submit">Reset Password</button>
        </form>

        <div class="form-footer">
            <p>Remember your password? <a href="./login.html">Login</a></p>
        </div>
    </div>
</body>

</html>
